# Fleet Vaults — nginx reverse proxy in front of the Next.js server (port 3000).
# Install to: /etc/nginx/sites-available/fleetvaults  (then symlink to sites-enabled)
# Certbot will edit this file to add the HTTPS (443) block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name fleetvaults.com www.fleetvaults.com;

    # Optional: raise if you later accept large uploads.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Long-cache Next.js immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
